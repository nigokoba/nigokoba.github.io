<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QRから、立方体が現れる</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.7 system-ui,sans-serif;background:#eef3f8;color:#18293c}main{max-width:720px;margin:36px auto;padding:24px}h1{line-height:1.35}section{background:white;padding:24px;border-radius:18px;margin:20px 0}button{border:0;border-radius:10px;background:#185adb;color:white;padding:14px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5}input{width:100%;padding:12px;font:inherit;margin:8px 0 16px}a{color:#185adb}.sheet{background:white;text-align:center;padding:24px}.targets{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap}.marker{width:260px;height:260px;object-fit:contain}#qr{background:white;padding:20px;display:inline-block}#qr img{display:block}#print-url{overflow-wrap:anywhere;font-size:12px}#hud{display:none;position:fixed;z-index:10;top:12px;left:12px;right:12px;background:#fffE;border-radius:12px;padding:12px;font-size:14px}#hud button{float:right;padding:6px 12px}body.ar main{display:none}body.ar #hud{display:block}body.ar{background:transparent;overflow:hidden}.hint{font-size:14px;color:#52677e}#error{color:#ad2637;white-space:pre-wrap}
    @media print{@page{size:A4;margin:15mm}body{background:white}main{margin:0;padding:0;max-width:none}main>*:not(#sheet){display:none!important}#sheet{border:0;margin:0;padding:0;display:block!important}.targets{flex-wrap:nowrap;gap:12mm}.marker{width:80mm;height:80mm}#qr{padding:5mm}#print-url{font-size:10pt}}
  </style>
  <script src="assets/qrcode.min.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <main>
    <h1>紙の上に、立方体を。</h1>
    <p>QRでこのページを開き、ARを開始。同じ紙の黒い「Hiro」マーカーにカメラを向けてください。</p>
    <section>
      <h2>1. ARを見る</h2>
      <button id="start">ARを開始（カメラを許可）</button>
      <p class="hint">明るい場所で、マーカーの四隅がすべて映るようにしてください。映像はこのブラウザ内で処理します。</p>
      <p id="error" role="alert"></p>
    </section>
    <section>
      <h2>2. 印刷する紙を準備</h2>
      <label for="url">公開済みのページURL（HTTPS）</label>
      <input id="url" type="url" placeholder="https://USERNAME.github.io/qr-webar/">
      <button id="generate">QRを作成・更新</button>
      <button id="print" disabled>マーカーとQRを印刷</button>
      <p class="hint">公開後はこのページのURLが自動で入ります。QRとHiroは隣に並べ、黒枠には重ねません。</p>
    </section>
    <section id="sheet" class="sheet">
      <h2>QR → ページを開く → ARを開始 → Hiroを見る</h2>
      <div class="targets"><img class="marker" src="assets/hiro.png" alt="AR認識用のHiroマーカー"><div id="qr" aria-label="ページを開くQRコード"></div></div>
      <p id="print-url">公開URLを指定してQRを作成してください。</p>
      <p>ARは左のHiroの上に表示されます。黒枠と周囲の白い余白を切り取らないでください。</p>
    </section>
  </main>
  <div id="hud"><button id="stop">終了</button><span id="status" role="status">カメラを準備しています…</span></div>
</body>
</html>
